# MyPromo for iOS, built on a rented Mac (Codemagic) and sent to TestFlight.
#
# The app is a Capacitor shell around the live site (see NATIVE.md), so the
# only thing that changes between builds is the native wrapper: the shell
# opens MYPROMO_URL, which is stamped into the config just before the sync.
#
# One-time setup, in this order (store/README.md §3 has every click):
#   1. Apple Developer → Identifiers → App ID com.mypromo.app, with Push
#      Notifications. Keys → an APNs key for Vercel.
#   2. App Store Connect → Users and Access → Integrations → App Store
#      Connect API → a key, role App Manager. Apps → New App, com.mypromo.app.
#   3. Codemagic → Add application → this repo. Team integrations →
#      Developer Portal → that key, named `mypromo` (the name below).
#   4. Codemagic → Code signing identities → iOS certificates → Generate
#      certificate (Apple Distribution). `ios_signing` below only fetches
#      signing files; it never creates them.
#   5. Apple Developer → Profiles → App Store Connect profile for
#      com.mypromo.app with that certificate; then Codemagic → iOS
#      provisioning profiles → Fetch profiles → download it.

workflows:
  ios:
    name: MyPromo iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: mypromo
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mypromo.app
      vars:
        MYPROMO_URL: https://mypromo-nu.vercel.app
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events: []          # started by hand from Codemagic, never by a push
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Point the shell at the live site and sync
        script: |
          node scripts/native-url.mjs
          npx cap sync ios
      - name: Apply the signing files
        script: xcode-project use-profiles
      - name: Number this build
        script: |
          # TestFlight refuses a build number it has already seen.
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" ios/App/App.xcodeproj/project.pbxproj
      - name: Build the app
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
