<title>MyPromo الأرشيف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --purple:#6B21B5;
    --purple-light:#8B5CF6;
    --purple-pale:#EDE9FE;
    --orange:#F97316;
    --orange-light:#FDBA74;
    --orange-pale:#FFF1E3;
    --bg:#F1F5F9;
    --surface:#FFFFFF;
    --ink:#1A1424;
    --ink-2:#655D75;
    --ink-3:#9C95A9;
    --line:#E8E4F0;
    --line-soft:#F0EDF6;
    --shadow:0 1px 2px rgba(26,20,36,.04), 0 4px 16px rgba(26,20,36,.06);
    --shadow-nav:0 -1px 20px rgba(26,20,36,.07);
    --r-card:16px;
    --r-tile:13px;
    --font:"Cairo","Segoe UI",system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  /* ---------- phone frame ---------- */
  .phone{
    width:100%;
    max-width:390px;
    background:var(--bg);
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  @media(min-width:440px){
    body{padding:24px 0;align-items:flex-start}
    .phone{
      min-height:auto;
      height:844px;
      border-radius:34px;
      box-shadow:0 12px 48px rgba(26,20,36,.16);
      border:1px solid var(--line);
    }
  }

  .rtl{direction:rtl;text-align:right}

  /* ---------- header ---------- */
  .head{
    background:var(--surface);
    padding:16px 18px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
    border-bottom:1px solid var(--line-soft);
    flex-shrink:0;
    z-index:2;
  }
  .head-row{
    display:flex;
    align-items:center;
    gap:11px;
  }
  .mark{width:34px;height:34px;flex-shrink:0;display:block}
  .head-titles{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .head-title{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
  .head-sub{font-size:12px;font-weight:400;color:var(--ink-3);line-height:1.3}

  .back{
    width:34px;height:34px;flex-shrink:0;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:11px;
    display:grid;place-items:center;
    color:var(--ink-2);
    cursor:pointer;
    padding:0;
  }
  .back:hover{background:var(--purple-pale);border-color:var(--purple-pale);color:var(--purple)}

  /* ---------- search ---------- */
  .search{
    display:flex;align-items:center;gap:9px;
    background:var(--bg);
    border:1px solid transparent;
    border-radius:12px;
    padding:0 13px;
    height:42px;
    transition:border-color .15s, background .15s;
  }
  .search:focus-within{background:var(--surface);border-color:var(--purple-light)}
  .search svg{color:var(--ink-3);flex-shrink:0}
  .search input{
    border:0;background:transparent;outline:0;
    font-family:var(--font);font-size:14px;font-weight:400;
    color:var(--ink);width:100%;
    padding:0;
  }
  .search input::placeholder{color:var(--ink-3)}

  /* ---------- segmented ---------- */
  .seg{
    display:flex;gap:4px;
    background:var(--bg);
    border-radius:11px;
    padding:4px;
  }
  .seg button{
    flex:1;border:0;cursor:pointer;
    font-family:var(--font);font-size:13.5px;font-weight:600;
    color:var(--ink-2);
    background:transparent;
    border-radius:8px;
    padding:8px 0;
    transition:.15s;
  }
  .seg button[aria-selected="true"]{
    background:var(--surface);
    color:var(--purple);
    box-shadow:0 1px 3px rgba(26,20,36,.08);
  }

  /* ---------- scroll body ---------- */
  .scroll{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:16px 18px 96px;
    display:flex;
    flex-direction:column;
    gap:9px;
  }

  .eyebrow{
    font-size:11px;font-weight:700;
    letter-spacing:.07em;
    color:var(--ink-3);
    margin:9px 2px 1px;
  }
  .eyebrow:first-child{margin-top:0}

  /* ---------- module card ---------- */
  .card{
    background:var(--surface);
    border-radius:var(--r-card);
    box-shadow:var(--shadow);
    display:flex;align-items:center;gap:13px;
    padding:13px 14px;
    width:100%;
    border:0;
    font-family:var(--font);
    text-align:right;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active{transform:scale(.985)}
  .card[disabled]{cursor:default;opacity:.72}
  .card[disabled]:active{transform:none}

  .tile{
    width:44px;height:44px;flex-shrink:0;
    border-radius:var(--r-tile);
    display:grid;place-items:center;
  }
  .card-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .card-name{
    font-size:14.5px;font-weight:600;color:var(--ink);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card-meta{font-size:12px;font-weight:400;color:var(--ink-3);line-height:1.3}
  .card-chev{color:var(--ink-3);flex-shrink:0}

  .pill{
    display:inline-flex;align-items:center;
    font-size:11px;font-weight:600;
    padding:3px 8px;border-radius:20px;
    line-height:1.4;
  }
  .pill-empty{background:var(--bg);color:var(--ink-3)}
  .pill-warn{background:var(--orange-pale);color:#C2410C}

  /* ---------- lecture row ---------- */
  .lec{
    background:var(--surface);
    border-radius:var(--r-card);
    box-shadow:var(--shadow);
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;
    width:100%;border:0;
    font-family:var(--font);text-align:right;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .lec:active{transform:scale(.985)}
  .num{
    width:30px;height:30px;flex-shrink:0;
    border-radius:9px;
    background:var(--purple-pale);
    color:var(--purple);
    display:grid;place-items:center;
    font-size:12.5px;font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .num.dup{background:var(--orange-pale);color:#C2410C}
  .num.none{background:var(--bg);color:var(--ink-3);font-size:14px}
  .lec-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .lec-name{
    font-size:14px;font-weight:500;color:var(--ink);line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .lec-meta{
    font-size:11.5px;color:var(--ink-3);
    display:flex;align-items:center;gap:6px;
  }
  .ext{
    font-weight:700;font-size:10px;letter-spacing:.04em;
    color:var(--ink-2);
  }
  .dot{width:3px;height:3px;border-radius:50%;background:var(--line);flex-shrink:0}

  /* ---------- notice ---------- */
  .notice{
    background:var(--orange-pale);
    border-radius:var(--r-card);
    padding:13px 14px;
    display:flex;gap:11px;align-items:flex-start;
  }
  .notice svg{color:var(--orange);flex-shrink:0;margin-top:1px}
  .notice-t{font-size:13px;font-weight:600;color:#7C2D12;line-height:1.4}
  .notice-b{font-size:12px;font-weight:400;color:#9A3412;line-height:1.55;margin-top:3px}

  .empty-state{
    text-align:center;
    padding:52px 24px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
  }
  .empty-state .tile{width:52px;height:52px;background:var(--purple-pale);color:var(--purple)}
  .empty-t{font-size:15px;font-weight:600}
  .empty-b{font-size:13px;color:var(--ink-3);line-height:1.6;max-width:250px}

  /* ---------- bottom nav ---------- */
  .nav{
    position:absolute;bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid var(--line-soft);
    box-shadow:var(--shadow-nav);
    display:flex;
    padding:8px 6px 10px;
    z-index:3;
  }
  .nav button{
    flex:1;border:0;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-family:var(--font);font-size:10.5px;font-weight:600;
    color:var(--ink-3);
    padding:4px 0;
    transition:color .15s;
  }
  .nav button[aria-selected="true"]{color:var(--purple)}
  .nav svg{width:21px;height:21px}

  :focus-visible{outline:2px solid var(--purple-light);outline-offset:2px}

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>

<div class="phone rtl">

  <header class="head" id="head"></header>

  <div class="scroll" id="scroll"></div>

  <nav class="nav" id="nav"></nav>

const TABS = [
  {id:'home',    label:'الرئيسية',   icon:I.home},
  {id:'lec',     label:'المحاضرات',  icon:I.book},

/* ============================================================
   State
   ============================================================ */
let tab = 'archive';
let sem = 'S1';
let openModule = null;
let q = '';

const head   = document.getElementById('head');
const scroll = document.getElementById('scroll');
const navEl  = document.getElementById('nav');

const total = m => m.lectures.length + m.nonNum.length;
const norm  = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* ============================================================
   Render
   ============================================================ */
function render(){
  renderNav();
  if(tab !== 'archive'){ renderPlaceholder(); return; }
  openModule ? renderModule() : renderModuleList();
}

function renderNav(){
  navEl.innerHTML = TABS.map(t =>
    `<button role="tab" aria-selected="${t.id===tab}" data-tab="${t.id}">
       ${svg(t.icon,21)}<span>${t.label}</span>
     </button>`).join('');
}

function renderPlaceholder(){
  const t = TABS.find(x => x.id === tab);
  head.innerHTML = `
    <div class="head-row">
      ${MARK}
      <div class="head-titles">
        <div class="head-title">${t.label}</div>
        <div class="head-sub">MyPromo · UNEM PCEM2</div>
      </div>
    </div>`;
  scroll.innerHTML = `
    <div class="empty-state">
      <div class="tile">${svg(I.clock,24)}</div>
      <div class="empty-t">${t.label} — لاحقًا</div>
      <div class="empty-b">هذه الشاشة لم تُبنَ بعد. نبني الأرشيف أولًا، ثم ننتقل إلى البقية خطوة بخطوة.</div>
    </div>`;
}

function renderModuleList(){
  head.innerHTML = `
    <div class="head-row">
      ${MARK}
      <div class="head-titles">
        <div class="head-title">الأرشيف</div>
        <div class="head-sub">UNEM PCEM2 · ${DATA.S1.length + DATA.S2.length} مواد</div>
      </div>
    </div>
    <div class="search">
      ${svg(I.search,17)}
      <input id="q" type="search" placeholder="ابحث في الأرشيف" value="${q}" autocomplete="off">
    </div>
    <div class="seg" role="tablist">
      <button role="tab" aria-selected="${sem==='S1'}" data-sem="S1">السداسي 1</button>
      <button role="tab" aria-selected="${sem==='S2'}" data-sem="S2">السداسي 2</button>
    </div>`;

  const list = DATA[sem].filter(m =>
    !q || norm(m.nom).includes(norm(q)) ||
    [...m.lectures, ...m.nonNum].some(l => norm(l.titre).includes(norm(q))));

  if(!list.length){
    scroll.innerHTML = `
      <div class="empty-state">
        <div class="tile">${svg(I.search,24)}</div>
        <div class="empty-t">لا نتائج</div>
        <div class="empty-b">لا توجد مادة أو محاضرة تطابق «${q}» في هذا السداسي.</div>
      </div>`;
    return;
  }

  scroll.innerHTML = list.map(m => {
    let meta, pill = '';
    if(m.vide){      meta = 'المجلد فارغ في Drive'; pill = `<span class="pill pill-empty">فارغ</span>`; }
    else if(m.nonIndex){ meta = 'لم يُفهرس بعد';      pill = `<span class="pill pill-empty">قيد الفهرسة</span>`; }
    else             meta = `${total(m)} ملف · ${m.prof}`;

    const warn = (m.flags && m.flags.length)
      ? `<span class="pill pill-warn">${m.flags.length} للمراجعة</span>` : '';

    return `<button class="card" data-mod="${m.id}" ${(m.vide||m.nonIndex)?'disabled':''}>
      <div class="tile" style="background:var(${m.tint});color:var(${m.fg})">${svg(m.icon,22)}</div>
      <div class="card-text">
        <div class="card-name">${m.nom}</div>
        <div class="card-meta">${meta}</div>
      </div>
      ${pill || warn}
      ${(m.vide||m.nonIndex) ? '' : `<span class="card-chev">${svg(I.chevron,18)}</span>`}
    </button>`;
  }).join('');
}

function renderModule(){
  const m = [...DATA.S1, ...DATA.S2].find(x => x.id === openModule);

  head.innerHTML = `
    <div class="head-row">
      <button class="back" id="back" aria-label="رجوع">${svg(I.chevronR,18)}</button>
      <div class="head-titles">
        <div class="head-title">${m.nom}</div>
        <div class="head-sub">${m.prof} · ${total(m)} ملف</div>
      </div>
      <div class="tile" style="width:34px;height:34px;background:var(${m.tint});color:var(${m.fg})">
        ${svg(m.icon,18)}
      </div>
    </div>`;

  const row = (l, cls, label) => `
    <button class="lec">
      <span class="num ${cls}">${label}</span>
      <span class="lec-text">
        <span class="lec-name">${l.titre}</span>
        <span class="lec-meta">
          <span class="ext">${l.ext}</span><span class="dot"></span>${l.mo} MB
        </span>
      </span>
      <span class="card-chev">${svg(I.chevron,17)}</span>
    </button>`;

  let html = '';

  if(m.lectures.length){
    html += `<div class="eyebrow">${m.partiel ? 'الملفات' : 'حسب ترتيب التدريس'}</div>`;
    html += m.lectures.map(l =>
      row(l, l.dup ? 'dup' : (l.n === null ? 'none' : ''), l.n === null ? '—' : l.n)).join('');
  }

  if(m.lectures.some(l => l.dup)){
    html += `<div class="notice">
      ${svg(I.alert,18)}
      <div>
        <div class="notice-t">ملفان يحملان الرقم 5</div>
        <div class="notice-b">«Les vaisseaux tête et cou» و«Lymphatiques tête–cou» كلاهما مُرقّم ‎-5-‎ في Drive. أيّهما يأتي أولًا؟</div>
      </div>
    </div>`;
  }

  if(m.nonNum.length){
    html += `<div class="eyebrow">بدون ترقيم — عصبية 2023</div>`;
    html += m.nonNum.map(l => row(l, 'none', '—')).join('');
  }

  if(m.flags.length){
    html += `<div class="eyebrow">تحتاج قرارًا منك</div>`;
    html += m.flags.map(f => `
      <button class="lec">
        <span class="num dup">${svg(I.alert,15)}</span>
        <span class="lec-text">
          <span class="lec-name">${f.titre}</span>
          <span class="lec-meta">${f.why}<span class="dot"></span>${f.mo} MB</span>
        </span>
      </button>`).join('');
  }

  scroll.innerHTML = html;
  scroll.scrollTop = 0;
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if(t){ tab = t.dataset.tab; openModule = null; q = ''; return render(); }

  const s = e.target.closest('[data-sem]');
  if(s){ sem = s.dataset.sem; return render(); }

  const mod = e.target.closest('[data-mod]');
  if(mod && !mod.disabled){ openModule = mod.dataset.mod; return render(); }

  if(e.target.closest('#back')){ openModule = null; return render(); }
});

document.addEventListener('input', e => {
  if(e.target.id !== 'q') return;
  q = e.target.value;
  // Re-render the list, then restore focus and caret position.
  const el = document.getElementById('q');
  const pos = el.selectionStart;
  renderModuleList();
  const el2 = document.getElementById('q');
  el2.focus();
  el2.setSelectionRange(pos, pos);
});

render();
</script>
